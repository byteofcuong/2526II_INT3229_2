version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: [ "server", "/data", "--console-address", ":9001" ]
    volumes:
      - minio_data:/data

  mc:
    depends_on:
      - minio
    image: minio/mc
    container_name: mc
    volumes:
      - ./nyc_taxi_data.csv:/tmp/nyc_taxi_data.csv
    entrypoint: >
      /bin/sh -c " sleep 5; /usr/bin/mc alias set myminio http://minio:9000 admin password; /usr/bin/mc mb myminio/warehouse; /usr/bin/mc mb myminio/rawdata; /usr/bin/mc cp /tmp/nyc_taxi_data.csv myminio/rawdata/csv/nyc_taxi_data.csv; exit 0; "

  rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: iceberg-rest
    depends_on:
      - minio
    ports:
      - "8181:8181"
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3a://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true

  spark-iceberg:
    image: tabulario/spark-iceberg:latest
    container_name: spark-iceberg
    depends_on:
      - rest
      - minio
    ports:
      - "8888:8888" # Jupyter
      - "8080:8080" # Spark UI
      - "10000:10000"
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    volumes:
      - ./scripts:/home/iceberg/scripts

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    user: root
    depends_on:
      - minio
    ports:
      - "9083:9083"
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - SERVICE_NAME=metastore
    volumes:
      - ./hive/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    entrypoint: >
      sh -c "
      /opt/hive/bin/schematool -dbType derby -initSchema &&
      cp /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.1.0.jar /opt/hive/lib/ &&
      cp /opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.11.271.jar /opt/hive/lib/ &&
      exec /opt/hive/bin/hive --skiphadoopversion --skiphbasecp --service metastore
      "

  trino:
    image: trinodb/trino:443
    container_name: trino
    depends_on:
      - minio
      - rest
      - hive-metastore
    ports:
      - "8081:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog

volumes:
  minio_data:
