services:
  minio:
    image: minio/minio:latest
    container_name: siem_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: siem_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Đợi MinIO khởi động...';
      sleep 5;
      mc alias set myminio http://minio:9000 admin password123;
      mc mb myminio/siem-cold-storage || true;
      echo 'Tạo bucket thành công';
      exit 0;
      "

  iceberg-catalog:
    image: postgres:13-alpine
    container_name: siem_iceberg_catalog
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg_catalog
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  minio_data:
  pg_data: